<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E0E0C">
<meta name="robots" content="noindex, nofollow">
<title>Panel del Coach · Team Macano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0E0E0C;--surface:#151513;--surface-elev:#1A1A18;--border:#2A2A26;--border-strong:#3A3A35;
    --text:#F5F1E8;--text-dim:#8B847A;--text-soft:#B8B2A6;--accent:#E85D2F;--accent-soft:rgba(232,93,47,.12);
    --green:#7BAE7F;--amber:#D9A441;--red:#C75C5C;--radius:14px;--radius-sm:9px;--ease:cubic-bezier(.25,.8,.35,1);}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:40px}
  .app{max-width:600px;margin:0 auto;padding:0 16px}
  header{padding:28px 0 14px}
  .top{display:flex;align-items:center;gap:9px;margin-bottom:16px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px rgba(232,93,47,.7)}
  .logo{font-family:'Fraunces',serif;font-size:14px;letter-spacing:.06em;color:var(--text-soft)}
  h1{font-family:'Fraunces',serif;font-weight:400;font-size:30px;line-height:1.15;margin-bottom:6px}
  .sub{color:var(--text-dim);font-size:12.5px}
  /* login */
  .auth{display:flex;align-items:center;justify-content:center;min-height:70vh;text-align:center}
  .auth-card{width:100%;max-width:340px}
  .auth-card h2{font-family:'Fraunces',serif;font-weight:400;font-size:24px;margin:12px 0 6px}
  .auth-card p{color:var(--text-soft);font-size:13px;margin-bottom:18px}
  input{width:100%;background:var(--surface-elev);border:1px solid var(--border-strong);border-radius:var(--radius);
    color:var(--text);font-family:inherit;font-size:16px;text-align:center;padding:13px;outline:none;margin-bottom:12px}
  input:focus{border-color:var(--accent)}
  .btn{width:100%;background:var(--accent);color:var(--bg);border:none;border-radius:var(--radius);padding:13px;
    font-family:inherit;font-weight:700;font-size:14.5px;cursor:pointer}
  .btn.ghost{background:transparent;border:1px solid var(--border-strong);color:var(--text-soft);font-weight:600}
  .err{color:var(--red);font-size:12.5px;min-height:18px;margin-top:8px}
  /* resumen */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 20px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 6px;text-align:center}
  .stat .v{font-family:'Fraunces',serif;font-size:23px}
  .stat .n{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);margin-top:2px}
  .stat.g .v{color:var(--green)}.stat.a .v{color:var(--amber)}.stat.r .v{color:var(--red)}
  .bar{display:flex;gap:8px;align-items:center;margin-bottom:16px}
  .bar .btn{width:auto;padding:9px 14px;font-size:12.5px}
  .upd{font-size:11px;color:var(--text-dim);margin-left:auto}
  /* cliente */
  .card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--border-strong);
    border-radius:var(--radius);padding:15px 16px;margin-bottom:11px}
  .card.g{border-left-color:var(--green)} .card.a{border-left-color:var(--amber)} .card.r{border-left-color:var(--red)}
  .c-top{display:flex;align-items:center;gap:9px;margin-bottom:3px}
  .c-name{font-family:'Fraunces',serif;font-size:18px;font-weight:500}
  .pill{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 9px;white-space:nowrap}
  .pill.c2{background:rgba(217,164,65,.16);color:#E9C36A;border:1px solid rgba(217,164,65,.45)}
  .pill.c1{background:var(--accent-soft);color:var(--accent);border:1px solid rgba(232,93,47,.35)}
  .estado{font-size:12.5px;margin-bottom:10px}
  .estado.g{color:var(--green)}.estado.a{color:var(--amber)}.estado.r{color:var(--red)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:7px;margin-bottom:11px}
  .m{background:var(--surface-elev);border-radius:var(--radius-sm);padding:8px 5px;text-align:center}
  .m .v{font-size:14.5px;font-weight:700;color:var(--text-soft)}
  .m .v.hl{color:var(--accent)} .m .v.ok{color:var(--green)}
  .m .n{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);margin-top:1px}
  .acts{display:flex;gap:8px;flex-wrap:wrap}
  .acts a,.acts button{flex:1;min-width:120px;text-align:center;text-decoration:none;font-family:inherit;font-size:12.5px;
    font-weight:600;border-radius:var(--radius-sm);padding:9px 10px;cursor:pointer;border:1px solid var(--border-strong);
    background:transparent;color:var(--text-soft)}
  .acts a.wa{background:var(--accent);border-color:var(--accent);color:var(--bg)}
  .empty{text-align:center;color:var(--text-dim);font-size:13.5px;padding:34px 10px}
  .sec-title{font-family:'Fraunces',serif;font-size:16px;margin:22px 0 10px;color:var(--text-soft)}
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-150%);background:var(--surface-elev);
    border:1px solid var(--green);border-radius:999px;padding:9px 18px;font-size:13px;transition:transform .3s var(--ease);z-index:90}
  .toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">

  <div id="authView" class="auth">
    <div class="auth-card">
      <span class="dot" style="display:inline-block"></span>
      <div class="logo" style="margin-top:8px">Team Macano</div>
      <h2>Panel del Coach</h2>
      <p>Área privada. Ingresa tu clave de administrador.</p>
      <input type="password" id="key" placeholder="Clave" autocomplete="current-password">
      <button class="btn" id="enter">Entrar</button>
      <div class="err" id="err"></div>
    </div>
  </div>

  <div id="mainView" style="display:none">
    <header>
      <div class="top"><span class="dot"></span><span class="logo">Team Macano</span></div>
      <h1>Panel del Coach</h1>
      <div class="sub" id="sub">Cargando…</div>
    </header>
    <div class="stats" id="stats"></div>
    <div class="bar">
      <button class="btn" id="reload" style="width:auto">↻ Actualizar</button>
      <button class="btn ghost" id="logout" style="width:auto">Salir</button>
      <span class="upd" id="upd"></span>
    </div>
    <div id="list"></div>
  </div>

</div>
<div class="toast" id="toast">Copiado</div>

<script>
const SYNC_URL = 'https://script.google.com/macros/s/AKfycbyvodzSWmymqQ5dwUVC6NQ5-mByizw8PZJ5jW760HdNig18bzdXor2GhBZk-WJiwucF/exec';
const $ = id => document.getElementById(id);
const K = 'macano_panel_key';

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);}

function nivel(c){
  if (c.diasSin === null) return 'a';
  if (c.diasSin <= 3) return 'g';
  if (c.diasSin <= 7) return 'a';
  return 'r';
}
function textoEstado(c){
  if (c.diasSin === null) return 'Nunca abrió su app todavía.';
  if (c.diasSin === 0) return '● Activo hoy';
  if (c.diasSin === 1) return '● Activo ayer';
  if (c.diasSin <= 3) return '● Activo hace ' + c.diasSin + ' días';
  if (c.diasSin <= 7) return '● Tibio — ' + c.diasSin + ' días sin entrar';
  return '● EN RIESGO — ' + c.diasSin + ' días sin entrar';
}
function msgSeguimiento(c){
  const n = (c.nombre||'').split(' ')[0];
  if (c.diasSin !== null && c.diasSin > 7)
    return 'Hola ' + n + ', ¿todo bien? Vi que llevas unos días sin entrar a tu plan. No hay reclamo — solo quiero saber qué se atravesó para acomodarlo. ¿Te ajusto los días o algo del plan?';
  if (c.entrenosSemana === 0)
    return 'Hola ' + n + ', arrancamos la semana. ¿Qué día le das el primer entreno? Avísame y te acompaño.';
  return 'Hola ' + n + ', vi tu avance de esta semana: ' + c.entrenosSemana + ' entrenos. ¡Bien ahí! ¿Cómo te sentiste con las cargas?';
}

async function cargar(key){
  const r = await fetch(SYNC_URL, {method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({action:'panel', adminKey:key})}).then(r=>r.json());
  return r;
}

function render(data){
  const cs = (data.clientes||[]).slice().sort((a,b)=>(b.diasSin??999)-(a.diasSin??999));
  const g = cs.filter(c=>nivel(c)==='g').length, a = cs.filter(c=>nivel(c)==='a').length, r = cs.filter(c=>nivel(c)==='r').length;
  $('sub').textContent = cs.length + ' cliente' + (cs.length===1?'':'s') + ' con app activa';
  $('upd').textContent = 'Al ' + new Date(data.generado).toLocaleString('es',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  $('stats').innerHTML =
    '<div class="stat"><div class="v">'+cs.length+'</div><div class="n">Total</div></div>'+
    '<div class="stat g"><div class="v">'+g+'</div><div class="n">Activos</div></div>'+
    '<div class="stat a"><div class="v">'+a+'</div><div class="n">Tibios</div></div>'+
    '<div class="stat r"><div class="v">'+r+'</div><div class="n">En riesgo</div></div>';

  if (!cs.length){ $('list').innerHTML = '<div class="empty">Todavía no hay clientes usando la app v2.<br>En cuanto entregues el primer plan, aparecerá aquí.</div>'; return; }

  $('list').innerHTML = '<div class="sec-title">Ordenados por quién necesita tu atención</div>' + cs.map(c=>{
    const lv = nivel(c);
    const dif = (c.pesoInicial && c.pesoActual) ? (c.pesoActual - c.pesoInicial) : null;
    const difTxt = dif===null ? '—' : (dif>0?'+':'') + dif.toFixed(1);
    const wa = c.whatsapp ? '<a class="wa" target="_blank" rel="noopener" href="https://wa.me/'+String(c.whatsapp).replace(/[^0-9]/g,'')+'?text='+encodeURIComponent(msgSeguimiento(c))+'">💬 Escribirle</a>' : '';
    return '<div class="card '+lv+'">'+
      '<div class="c-top"><span class="c-name">'+c.nombre+'</span>'+
        '<span class="pill '+(c.ciclo>=2?'c2':'c1')+'">'+(c.ciclo>=2?'★ Ciclo '+c.ciclo:'Ciclo 1')+'</span></div>'+
      '<div class="estado '+lv+'">'+textoEstado(c)+'</div>'+
      '<div class="grid">'+
        '<div class="m"><div class="v hl">S'+(c.semana||'—')+'</div><div class="n">Semana</div></div>'+
        '<div class="m"><div class="v'+(c.entrenosSemana>0?' ok':'')+'">'+c.entrenosSemana+'</div><div class="n">Entrenos<br>esta sem.</div></div>'+
        '<div class="m"><div class="v">'+c.totalEntrenos+'</div><div class="n">Entrenos<br>total</div></div>'+
        '<div class="m"><div class="v">'+difTxt+'</div><div class="n">Peso (kg)</div></div>'+
        '<div class="m"><div class="v">'+(c.checkins||0)+'</div><div class="n">Check-ins</div></div>'+
        '<div class="m"><div class="v">'+(c.cargaMax||0)+'</div><div class="n">Carga máx.</div></div>'+
      '</div>'+
      '<div class="acts">'+wa+
        '<button onclick="copiar(\''+c.slug+'\')">Copiar mensaje</button>'+
        '<a href="https://couch-iaperu.github.io/u/'+c.slug+'/" target="_blank" rel="noopener">Ver su app</a>'+
      '</div></div>';
  }).join('');
  window._cs = cs;
}

function copiar(slug){
  const c = (window._cs||[]).find(x=>x.slug===slug); if(!c) return;
  const t = msgSeguimiento(c);
  navigator.clipboard.writeText(t).then(()=>toast('Mensaje copiado')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    document.execCommand('copy');ta.remove();toast('Mensaje copiado');});
}

async function entrar(key, silent){
  try{
    const d = await cargar(key);
    if(!d.ok){ if(!silent) $('err').textContent = 'Clave incorrecta.'; return false; }
    try{ localStorage.setItem(K, key); }catch(e){}
    $('authView').style.display='none'; $('mainView').style.display='block';
    render(d); return true;
  }catch(e){ if(!silent) $('err').textContent='No se pudo conectar. Revisa tu internet.'; return false; }
}

$('enter').onclick = ()=>{ $('err').textContent=''; entrar($('key').value.trim(), false); };
$('key').addEventListener('keydown', e=>{ if(e.key==='Enter') $('enter').click(); });
$('reload').onclick = async ()=>{ const k=localStorage.getItem(K); if(k){ const d=await cargar(k); if(d.ok){ render(d); toast('Actualizado'); } } };
$('logout').onclick = ()=>{ try{localStorage.removeItem(K);}catch(e){} location.reload(); };

(function(){ let k=null; try{k=localStorage.getItem(K);}catch(e){} if(k) entrar(k,true); })();
</script>
</body>
</html>
